<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playwright | TestNova</title>
  <meta name="description" content="Beginner-friendly Playwright lessons with topic navigation, examples, checkboxes, and progress tracking." />
  <link rel="canonical" href="https://www.testnova.in/playwright-reader.html" />
  <link rel="stylesheet" href="styles.css?v=playwright-codegen-upload-20260826" />
</head>
<body class="learning-page ai-reader-page" data-ai-reader-track="playwright">
  <header class="topbar">
    <div class="container nav-container">
      <a class="brand" href="index.html">TestNova</a>
      <nav class="site-nav" aria-label="Primary navigation"></nav>
    </div>
  </header>

  <main class="ai-reader-shell">
    <aside class="ai-reader-sidebar" data-ai-reader-sidebar>
      <a class="text-link" href="index.html#featured-readers">Back to landing page</a>
      <div class="ai-reader-sidebar-copy">
        <span class="section-tag">Automation Reader</span>
        <h1>Playwright</h1>
        <p>Open a topic from the left navigation. Your progress and completed-topic checkboxes are saved in this browser.</p>
      </div>
      <div class="progress-panel">
        <div class="progress-header">
          <span class="level-pill" data-reader-level>Lv 1</span>
          <span class="progress-counts" data-reader-counts>0 / 0</span>
        </div>
        <div class="xp-bar"><i class="xp-fill" data-reader-fill></i></div>
        <div class="xp-meta">
          <span data-reader-pct>0%</span>
          <span data-reader-next>Start reading</span>
        </div>
      </div>
      <nav class="ai-reader-topic-nav" aria-label="Playwright topics" data-reader-nav></nav>
    </aside>

    <section class="ai-reader-main">
      <div class="ai-reader-toolbar">
        <button class="secondary-btn" type="button" data-reader-copy>Copy current content</button>
        <span data-reader-save-state>Read-only learning content.</span>
      </div>
      <article class="glass-card ai-reader-content" data-reader-content></article>
    </section>
  </main>

  <script src="site.js?v=remove-notes-20260818"></script>
  <script src="playwright-curriculum.js?v=playwright-codegen-upload-20260826"></script>
  <script src="ai-reader.js?v=playwright-codegen-upload-20260826"></script>
  <script src="registration.js"></script>
</body>
</html>
