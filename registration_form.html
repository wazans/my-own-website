<div class="register-panel glass-card">
  <form class="lead-form access-form contextual-lead-form universal-lead-form" data-registration-form data-form-type="register" novalidate>
    <input type="hidden" name="_subject" value="New TestNova Lead - Register Interest" />
    <input type="hidden" name="_template" value="table" />
    <input type="hidden" name="_captcha" value="false" />

    <div class="form-row">
      <div class="form-field">
        <label for="tn-full-name">Full Name</label>
        <input id="tn-full-name" name="Full Name" type="text" autocomplete="name" placeholder="Your full name" />
        <small class="field-error" data-error-for="full_name"></small>
      </div>
      <div class="form-field">
        <label for="tn-phone">Phone Number *</label>
        <input id="tn-phone" name="Phone Number" type="tel" inputmode="tel" autocomplete="tel" placeholder="WhatsApp number" data-lead-field="phone" required />
        <small class="field-error" data-error-for="phone"></small>
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label for="tn-email">Email Address</label>
        <input id="tn-email" name="Email Address" type="email" autocomplete="email" placeholder="Email, optional" data-lead-field="email" />
        <small class="field-error" data-error-for="email"></small>
      </div>
      <div class="form-field">
        <label for="tn-interested-in">Interested In</label>
        <select id="tn-interested-in" name="Interested In" data-lead-field="interested">
          <option value="">Select if you want</option>
          <option>QA Engineering</option>
          <option>Development Technologies</option>
          <option>AI &amp; Emerging Technologies</option>
          <option>Career Guidance</option>
          <option>Resume Review</option>
          <option>Corporate Training</option>
          <option>Free AI Kit</option>
          <option>Technology on Demand</option>
          <option>Other</option>
        </select>
        <small class="field-error" data-error-for="interested"></small>
      </div>
    </div>

    <div class="form-row other-interest-row">
      <div class="form-field full">
        <label for="tn-other-interest">Technology or other details</label>
        <input id="tn-other-interest" name="Technology On Demand" type="text" placeholder="Which technology do you want to learn? Example: Cypress, Snowflake, AWS, GenAI" data-lead-field="other_interest" />
        <small class="field-error" data-error-for="other_interest"></small>
      </div>
    </div>

    <p class="registration-bonus">Free prize after registration: AI starter kit + priority demo callback.</p>
    <button class="form-submit" type="submit"><span>Unlock My Free Goodies</span></button>
    <div class="form-message" role="status" aria-live="polite"></div>
  </form>
</div>
