<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPL Historical Scorecard Frame</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #101827; color: #f8fafc; }
    .frame-card { padding: 1rem; border: 1px solid rgba(148,163,184,.24); border-radius: 14px; margin: .75rem; background: rgba(15,23,42,.88); }
    h1 { font-size: 1.2rem; margin: 0 0 .8rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .45rem .8rem; margin: 0; }
    dt { color: #94a3b8; }
    dd { margin: 0; font-weight: 700; }
    button { margin-top: 1rem; min-height: 42px; border-radius: 10px; border: 1px solid #38bdf8; background: #0f172a; color: #e0f2fe; padding: .6rem .9rem; cursor: pointer; }
    .details { margin-top: .75rem; padding: .75rem; border-radius: 10px; background: rgba(56,189,248,.1); }
  </style>
</head>
<body>
  <main class="frame-card" data-testid="scorecard-frame-content">
    <h1>Historical Scorecard Practice</h1>
    <dl>
      <dt>Team A score</dt><dd data-testid="frame-team-a-score">Gujarat Titans 155/8</dd>
      <dt>Team B score</dt><dd data-testid="frame-team-b-score">Royal Challengers Bengaluru 161/5</dd>
      <dt>Match result</dt><dd data-testid="frame-match-result">RCB won by 5 wickets</dd>
    </dl>
    <button type="button" id="expand-scorecard" data-testid="expand-scorecard" aria-expanded="false">Expand scorecard</button>
    <div id="scorecard-details" class="details" data-testid="scorecard-details" hidden>Final venue: Narendra Modi Stadium. Snapshot: 2026 final sample. Virat Kohli finished 75* as RCB chased 156 in 18 overs.</div>
  </main>
  <script>
    document.getElementById('expand-scorecard').addEventListener('click', function () {
      var details = document.getElementById('scorecard-details');
      var isHidden = details.hidden;
      details.hidden = !isHidden;
      this.setAttribute('aria-expanded', String(isHidden));
    });
  </script>
</body>
</html>
