<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student dashboard | TestNova</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/design-system.css">
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body class="tutorial-home">
  <header class="topbar"><div class="container nav-container">
    <a class="brand" href="/">TestNova</a><nav class="site-nav" aria-label="Primary navigation"></nav>
  </div></header>
  <main class="container student-dashboard">
    <h1>Student dashboard</h1>
    <p role="status" id="student-status">Loading student account…</p>
    <section id="student-auth" class="student-panel" hidden>
      <h2 id="student-form-title">Sign in</h2>
      <form id="student-form">
        <label id="student-name-row" hidden>Display name <input name="displayName" autocomplete="name" maxlength="80"></label>
        <label id="student-email-row">Email <input name="email" type="email" autocomplete="email" maxlength="254"></label>
        <label id="student-password-row">Password <input name="password" type="password" minlength="8" maxlength="72" autocomplete="current-password"></label>
        <button class="primary-btn" type="submit" id="student-submit">Sign in</button>
      </form>
      <div class="student-actions" id="student-options">
        <button class="secondary-btn" type="button" data-mode="signin">Sign in</button>
        <button class="secondary-btn" type="button" data-mode="signup">Create account</button>
        <button class="secondary-btn" type="button" data-mode="forgot">Forgot password</button>
        <button class="secondary-btn" type="button" id="student-google" hidden>Continue with Google</button>
      </div>
    </section>
    <section id="student-progress" hidden>
      <div class="student-actions"><h2 id="student-greeting"></h2><button class="secondary-btn" type="button" id="student-logout">Sign out</button></div>
      <p id="student-identity"></p>
      <p id="student-summary"></p>
      <h2>Your courses</h2>
      <div id="student-courses" class="student-grid"></div>
      <h2>Recently studied</h2>
      <ul id="student-recent"></ul>
    </section>
    <p><a href="/#tutorials">Browse public tutorials</a></p>
  </main>
  <footer class="site-footer"></footer>
  <script src="/site.js?v=student-1"></script>
  <script src="/global-ui.js"></script>
  <script src="/student-account.js"></script>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
